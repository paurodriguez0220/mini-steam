# Full local stack: SQL Server, blob emulator, the API, the storefront and the three games.
# Bring it up with ./scripts/up.ps1 (or `docker compose up -d --build`).
name: mini-steam

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      # The API will not start until SQL can actually answer a query.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  azurite:
    # Local stand-in for Azure Blob Storage so icon uploads work offline.
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    ports:
      - "${AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data

  api:
    build:
      context: .
      dockerfile: MiniSteam/Dockerfile
    depends_on:
      sql:
        condition: service_healthy
      azurite:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=gamesappdb;User ID=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=False;Connection Timeout=30;"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: MiniSteamAPI
      Jwt__Audience: MiniSteamClient
      Jwt__DurationInMinutes: "60"
      AzureBlobStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      Cors__AllowedOrigins__0: "http://localhost:${UI_PORT:-5173}"
      Seed__UserEmail: ${SEED_USER_EMAIL}
      Seed__UserPassword: ${SEED_USER_PASSWORD}
      Seed__GameUrls__2048: "http://localhost:${GAME_2048_PORT:-5174}"
      Seed__GameUrls__Snake: "http://localhost:${GAME_SNAKE_PORT:-5175}"
      Seed__GameUrls__Minesweeper: "http://localhost:${GAME_MINESWEEPER_PORT:-5176}"
    ports:
      - "${API_PORT:-8080}:8080"

  ui:
    build:
      context: ./MiniSteamUI/ministeamui
      args:
        # Vite inlines these at build time, so they are baked into the image.
        VITE_API_URL: "http://localhost:${API_PORT:-8080}"
        VITE_API_AUTH_USERNAME: ${SEED_USER_EMAIL}
        VITE_API_AUTH_PASSWORD: ${SEED_USER_PASSWORD}
    depends_on:
      - api
    ports:
      - "${UI_PORT:-5173}:8080"

  game-2048:
    build:
      context: ./2048/2048
    ports:
      - "${GAME_2048_PORT:-5174}:8080"

  game-snake:
    build:
      context: ./Snake/snake
    ports:
      - "${GAME_SNAKE_PORT:-5175}:8080"

  game-minesweeper:
    build:
      context: ./Minesweeper/minesweeper
    ports:
      - "${GAME_MINESWEEPER_PORT:-5176}:8080"

volumes:
  sql-data:
  azurite-data:
