# Full local stack: the API (SQLite), a blob emulator, the storefront and the games.
# Bring it up with ./scripts/up.ps1 (or `docker compose up -d --build`).
name: mini-steam

services:
  azurite:
    # Local stand-in for Azure Blob Storage so icon uploads work offline.
    image: ${AZURITE_IMAGE}
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    ports:
      - "${AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data

  api:
    build:
      context: .
      dockerfile: MiniSteam/Dockerfile
    depends_on:
      azurite:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      # Absolute path on the api-data volume. A relative path would be resolved
      # against the app directory, which is read-only for the non-root user.
      ConnectionStrings__DefaultConnection: "Data Source=/data/ministeam.db"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: MiniSteamAPI
      Jwt__Audience: MiniSteamClient
      Jwt__DurationInMinutes: "60"
      AzureBlobStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      Cors__AllowedOrigins__0: "http://localhost:${UI_PORT:-5173}"
      Seed__UserEmail: ${SEED_USER_EMAIL}
      Seed__UserPassword: ${SEED_USER_PASSWORD}
      Seed__GameUrls__2048: "http://localhost:${GAME_2048_PORT:-5174}"
      Seed__GameUrls__Snake: "http://localhost:${GAME_SNAKE_PORT:-5175}"
      Seed__GameUrls__Minesweeper: "http://localhost:${GAME_MINESWEEPER_PORT:-5176}"
    ports:
      - "${API_PORT:-8085}:8080"
    volumes:
      - api-data:/data

  ui:
    build:
      # Root context: the SPAs import shared/theme.css from the repo root.
      context: .
      dockerfile: MiniSteamUI/ministeamui/Dockerfile
      args:
        # Vite inlines these at build time, so they are baked into the image.
        VITE_API_URL: "http://localhost:${API_PORT:-8085}"
        VITE_API_AUTH_USERNAME: ${SEED_USER_EMAIL}
        VITE_API_AUTH_PASSWORD: ${SEED_USER_PASSWORD}
    depends_on:
      - api
    ports:
      - "${UI_PORT:-5173}:8080"

  game-2048:
    build:
      context: .
      dockerfile: 2048/2048/Dockerfile
      args:
        # Where the game posts its score messages. The storefront validates the
        # sending origin on its side too.
        VITE_STOREFRONT_ORIGIN: "http://localhost:${UI_PORT:-5173}"
    ports:
      - "${GAME_2048_PORT:-5174}:8080"

  game-snake:
    build:
      context: .
      dockerfile: Snake/snake/Dockerfile
      args:
        # Where the game posts its score messages. The storefront validates the
        # sending origin on its side too.
        VITE_STOREFRONT_ORIGIN: "http://localhost:${UI_PORT:-5173}"
    ports:
      - "${GAME_SNAKE_PORT:-5175}:8080"

  game-minesweeper:
    build:
      context: .
      dockerfile: Minesweeper/minesweeper/Dockerfile
      args:
        # Where the game posts its score messages. The storefront validates the
        # sending origin on its side too.
        VITE_STOREFRONT_ORIGIN: "http://localhost:${UI_PORT:-5173}"
    ports:
      - "${GAME_MINESWEEPER_PORT:-5176}:8080"

  game-tictactoe:
    build:
      context: .
      dockerfile: TicTacToe/tictactoe/Dockerfile
      args:
        # Where the game posts its score messages. The storefront validates the
        # sending origin on its side too.
        VITE_STOREFRONT_ORIGIN: "http://localhost:${UI_PORT:-5173}"
    ports:
      - "${GAME_TICTACTOE_PORT:-5177}:8080"

volumes:
  api-data:
  azurite-data:
